                                <!-- oxfmt-ignore -->
                                <p class="text-large" style="white-space:pre-wrap;"><strong>Emily Schoen Branch</strong> is a teacher, choreographer, and dancer named one of Dance Magazine's "Top 25 to Watch." Her work and research are rooted in a commitment to access — a belief that dance belongs in fuller conversation with the world, and that the artform deepens when more people can touch it, and it can touch them.</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">She has been recognized with numerous residencies and awards, including the Martha Duffy Resident Artist at <a href="https://baryshnikovarts.org/" target="_blank">Baryshnikov Arts Center</a> (NY), the <a href="https://gibneydance.org/" target="_blank">Gibney Dance </a>boo-koo award for emerging artists, and a Princess Grace Fellowship nomination through <a href="https://www.metdance.org/" target="_blank">METdance</a> (TX). Residencies span domestic and international contexts, among them the <a href="http://www.commune-tunis.gov.tn/publish/content/article.asp?id=19179&amp;idDiv=4#" target="_blank">Tunisian National Theater </a>and J<a href="https://jcal.org/" target="_blank">amaica Center for Arts and Learning</a>'s Choreographers and Composers series. She has fulfilled twenty commissions for companies and university programs nationwide, including the <a href="https://dance.washington.edu/" target="_blank">University of Washington</a>, <a href="https://www.cwu.edu/academics/dance/index.php" target="_blank">Central Washington University</a>, <a href="https://www.olympicballet.org/" target="_blank">Olympic Ballet Theatre </a>(Washington), <a href="https://www.sbdancetheater.org/" target="_blank">Santa Barbara Dance Theater</a> (California), <a href="https://ormaodance.org/dance-company/" target="_blank">Ormao Dance Company</a> (Colorado), and <a href="https://www.columbiaballetcollaborative.com/" target="_blank">Columbia Ballet Collaborative</a> (New York).</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">Her company, ESB Dance Projects (formerly Schoen Movement Company), is home for her creative work. A highlight was a two-year collaboration with Tunisian dancers resulting in <em>See me in your eye</em>, an evening-length work premiering in New York in 2019, supported by  <a href="https://baryshnikovarts.org/" target="_blank">Baryshnikov Arts Center</a>, <a href="http://dancemotionusa.org/index.html" target="_blank">Dance Motion USA</a> / <a href="https://www.bam.org/" target="_blank">Brooklyn Academy of Music</a>, Q<a href="https://www.nyc-arts.org/organizations/queens-council-on-the-arts/" target="_blank">ueens Council on the Arts,</a> <a href="https://laguardia.catalog.cuny.edu/student-programs-and-services/laguardia-performing-arts-center" target="_blank">LaGuardia Performing Arts Center</a>, and the <a href="https://tn.usembassy.gov/" target="_blank">US Embassy in Tunisia</a>. The company has appeared at <a href="https://www.judson.org/" target="_blank">Judson Memorial Church</a>, <a href="https://www.westfestdance.com/" target="_blank">WestFest,</a> <a href="https://jcal.org/" target="_blank">Jamaica Performing Arts Center</a>, <a href="https://publictheater.org/performances-jp/2025/d/dancenow/" target="_blank">Joe’s Pub/DanceNOW</a>, <a href="https://www.jacobspillow.org/festival/" target="_blank">Jacob’s Pillow Dance Festival</a>, as well as in the headline repertory performance, <em>An Evening of Dance with Emily Branch</em>, presented by the <a href="https://wou.edu/smith/" target="_blank">Smith Fine Arts Series at Western Oregon University</a>.</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">Committed to bringing dance beyond traditional venues, Emily created <em>Flight / An Evening of Dance and Drinks</em>, a site-specific happy-hour performance series for breweries, produced at six locations across New York, Pennsylvania, New Mexico, California, and Washington.</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">She also directs and produces screendance. Her film <em>Hollow Hearts</em> received Honorable Mention at the inaugural <a href="https://www.pnb.org/" target="_blank">Pacific Northwest Balle</a>t Dance Film Festival and won "Excellence in Dance and Videography" at AAlchemy’s <a href="https://www.aalchemy.org/news-and-events/" target="_blank">Give Me a Break Dance Film Festival</a> (NY).</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">As a performer, Emily has worked with <a href="https://www.aimbykyleabraham.com/" target="_blank">Kyle Abraham/A.I.M</a>.; the <a href="https://www.metopera.org/" target="_blank">Metropolitan Opera</a> in works by <a href="https://dovadance.org/aboutus/#Doug" target="_blank">Doug Varone</a>, <a href="https://markmorrisdancegroup.org/the-dance-group/mark-morris/" target="_blank">Mark Morris</a>, and <a href="https://www.imdb.com/name/nm0158666/" target="_blank">Carolyn Choa</a>; and <a href="https://rollingstones.com/" target="_blank">The Rolling Stones</a> during their 50th Anniversary reunion tour. She danced for eight years with <a href="https://www.keigwinandcompany.com/" target="_blank">KEIGWIN + COMPANY</a>, touring nationally and internationally, collaborating on more than a dozen new works, and serving as répétiteur. She also assisted Larry Keigwin on commissions for <a href="https://www.juilliard.edu/" target="_blank">The Juilliard School</a>, <a href="https://www.mmm.edu/departments/dance/" target="_blank">Marymount Manhattan College</a>, and his community series <em>Bolero</em>.</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">Since relocating from New York, Emily has served on faculty at <a href="https://www.pnb.org/pnb-school/" target="_blank">Pacific Northwest Ballet School</a>, <a href="https://spectrumdance.org/" target="_blank">Spectrum Dance Theater</a>, <a href="https://www.olympicballet.com/" target="_blank">Olympic Ballet School</a>, and <a href="https://www.hengdadance.com/" target="_blank">Hengda Dance Academy</a>, and her choreography has been supported by the <a href="https://www.seattle.gov/arts" target="_blank">Seattle Office of Arts &amp; Culture</a>.</p>
                                <!-- oxfmt-ignore -->
                                <p style="white-space:pre-wrap;">She holds an MFA in Dance from the University of Washington and graduated Summa Cum Laude from the <a href="https://dance.arizona.edu/" target="_blank">University of Arizona</a> with a BFA in Dance and a BS in Nutritional Sciences. She began her early training with Kellie Plath near her hometown of Brookfield, Wisconsin.</p>
