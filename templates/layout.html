<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta
      name="description"
      content="Emily Schoen Branch is a choreographer, dancer, and educator living and working in Seattle."
    />
    {% if page.url != "/404.html" %}
    <link rel="canonical" href="https://esb.dance{{ page.url }}" />
    {% endif %}
    <script defer src="/assets/site.js?v=4"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=13" />
  </head>
  <body class="{{ bodyClass }}">
    <div class="site-wrapper" id="site">
      <a class="skip-link" href="#page">Skip to content</a>
      {% include "header.html" %} {{ content | safe }} {% if page.url !=
      "/404.html" %}{% include "footer.html" %}{% endif %}
    </div>
  </body>
</html>
