{{define "body-class"}}{{end}}
{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{template "title" .}}</title>
  <meta name="description" content="Emily Schoen Branch is a choreographer, dancer, and educator living and working in Seattle."/>
  {{if .Canonical}}<link rel="canonical" href="{{.Canonical}}"/>{{end}}
  <script defer src="/assets/site.js?v=4"></script>
  <link rel="stylesheet" href="/assets/styles.css?v=13"/>
</head>
<body class="{{template "body-class" .}}">
  <div class="site-wrapper" id="site">
    <a class="skip-link" href="#page">Skip to content</a>
    {{template "header" .}}
    {{template "content" .}}
    {{template "footer" .}}
  </div>
</body>
</html>
{{end}}
